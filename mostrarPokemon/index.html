<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .bg-planta {

            background-color: rgb(135, 209, 164);

        }

        .bg-veneno {

            background-color: rgb(188, 159, 212);

        }
    </style>

</head>

<body>

    <h1 class="text-center bg-danger p-3 text-light">Pokémon</h1>

    <div class="container mt-5">
        <div class="row">

            <div class="col-md-4 col-sm-12 rounded-4 ">

                <div class="card" style="width:400px">
                    <img class="card-img-top" src="img/bulbasaur.jpg" alt="Card image">
                    <div class="card-body">

                        <h3 class="card-title text-center">Bulbasaur</h3>

                        <h4 class="card-text mt-4 text-center">
                            <span class="badge bg-planta me-5 p-2 text-dark">Planta</span>
                            <span class="badge bg-veneno p-2 text-dark">Veneno</span>
                            </p>
                        </h4>

                        <div class="row text-center m-3 mt-4">

                            <span class="text-secondary col-4">#0001</span>

                            <span class="text-secondary col-4 border-secondary border-start border-end">Alto
                                7</span>

                            <span class="text-secondary col-4">Peso 69</span>

                        </div>

                        <a href="#" class="btn btn-primary mt-3">Ver más</a>

                    </div>
                </div>

            </div>

            <div class="col-md-4 rounded-4 col-sm-12">

                <div class="card" style="width:400px">
                    <img class="card-img-top" src="img/ivysaur.png" alt="Card image">
                    <div class="card-body">

                        <h3 class="card-title text-center">Ivysaur</h3>

                        <h4 class="card-text mt-4 text-center">
                            <span class="badge bg-planta me-5 p-2 text-dark">Planta</span>
                            <span class="badge bg-veneno p-2 text-dark">Veneno</span>
                            </p>
                        </h4>


                        <div class="row text-center m-3 mt-4">

                            <span class="text-secondary col-4">#0002</span>

                            <span class="text-secondary col-4 border-secondary border-start border-end">Alto
                                10</span>

                            <span class="text-secondary col-4">Peso 130</span>

                        </div>

                        <a href="#" class="btn btn-primary mt-3">Ver más</a>
                    </div>
                </div>

            </div>

            <div class="col-md-4 rounded-4 col-sm-12">

                <div class="card" style="width:400px">
                    <img class="card-img-top" src="img/venusaur.jpg" alt="Card image">
                    <div class="card-body">

                        <h3 class="card-title text-center">Venusaur</h3>

                        <h4 class="card-text mt-4 text-center">
                            <span class="badge bg-planta me-5 p-2 text-dark">Planta</span>
                            <span class="badge bg-veneno p-2 text-dark">Veneno</span>
                            </p>
                        </h4>

                        <div class="row text-center m-3 mt-4">

                            <span class="text-secondary col-4">#0003</span>

                            <span class="text-secondary col-4 border-secondary border-start border-end">Alto
                                20</span>

                            <span class="text-secondary col-4">Peso 1000</span>

                        </div>

                        <a href="#" class="btn btn-primary mt-3">Ver más</a>
                    </div>
                </div>

            </div>

        </div>
    </div>


</body>

</html>
